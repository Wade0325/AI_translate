# 推 v* tag 時建置 Windows 免安裝包並發布 GitHub Release

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-zip:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build release package
        shell: powershell
        run: .\build_release.ps1 -Version "${{ github.ref_name }}" -SkipFrontend

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: powershell
        run: >
          gh release create "${{ github.ref_name }}"
          (Get-ChildItem build\AI_Translate-*-win64.zip).FullName
          --title "AI_Translate ${{ github.ref_name }}"
          --generate-notes
