# 推 v* tag 時：先跑完整的 CI（ci.yml），通過後建置 Windows 免安裝版並發布 GitHub Release

name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  ci:
    # $/ 是同一個 repo、同一個 commit 的 ci.yml（GitHub 建議的寫法，不受執行期的檔案狀態影響）
    uses: $/.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: read # ci.yml 的 changes job 宣告了這個權限；tag 觸發時它不會列 PR 的檔案

  windows-zip:
    needs: ci
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write # gh release create
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          # 發版不還原任何快取；package.json 有 devEngines.packageManager 時 setup-node 預設會開
          package-manager-cache: false

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build release package
        shell: powershell
        env:
          TAG: ${{ github.ref_name }}
        run: .\build_release.ps1 -Version "$env:TAG" -SkipFrontend

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: powershell
        run: >
          gh release create "$env:TAG"
          (Get-ChildItem build\AI_Translate-*-win64.zip).FullName
          --title "AI_Translate $env:TAG"
          --generate-notes
