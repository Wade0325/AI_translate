# 推 v* tag 時發布 GitHub Release（#278）：
#   1. ci：跑完整的 CI（ci.yml）。
#   2. build：在 Windows 建置免安裝版，準備 FFmpeg 原始碼的附件與 SHA256SUMS，檢查齊全後交給 publish。
#      只有讀取權限：npm 套件與建置腳本在這裡執行，碰不到能改 release 的權杖。
#   3. publish：唯一有 contents: write 的 job，不執行任何建置或第三方套件。先建草稿、上傳附件，確認草稿上
#      的附件齊全、大小與 SHA-256 和建置的相同，才以 prerelease 公開。任何一步失敗就刪掉這次建的草稿
#      （tag 不動），不會半發布；修好之後重新執行失敗的 job 即可。
# 每一版目前都是測試版：標題與 release notes 標 beta，以 prerelease 發布（tools/release_assets.py）。
# 附件、標題與 release notes 的判斷都寫在 tools/release_assets.py（tests/unit/test_release_assets.py 測）。

name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  ci:
    # $/ 是同一個 repo、同一個 commit 的 ci.yml（GitHub 建議的寫法，不受執行期的檔案狀態影響）。
    # actionlint 1.7.12 還不認得 $/，在 .github/actionlint.yaml 略過這一個錯誤
    uses: $/.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: read # ci.yml 的 changes job 宣告了這個權限；tag 觸發時它不會列 PR 的檔案

  build:
    needs: ci
    # 和 ci.yml 的 portable job 同一個映像：每個 PR 都在那裡建置過同樣的發布包
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PYTHONIOENCODING: utf-8 # tools/*.py 印中文
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: 檢查 tag 的格式
        # v<主>.<次>.<修補>，可以接 -rc.1 之類的標記；其他寫法在建置之前就停下
        run: python -m tools.release_assets title "$env:TAG"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          # 發版不還原任何快取；package.json 有 devEngines.packageManager 時 setup-node 預設會開
          package-manager-cache: false

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build release package
        shell: powershell
        run: .\build_release.ps1 -Version "$env:TAG" -SkipFrontend

      - name: 檢查發布包
        # 和 ci.yml 的 portable job 同一套檢查：名稱、必要的檔案、後端白名單、沒有執行期資料、exe 的版本資訊
        run: python tools/portable_zip.py check "build/Mimiji-$env:TAG-win64.zip"

      - name: 準備附件（發布包、FFmpeg 的原始碼與 SHA256SUMS）
        run: python -m tools.release_assets prepare "$env:TAG" build/release-assets

      - name: 檢查附件齊全
        run: python -m tools.release_assets check "$env:TAG" build/release-assets

      - name: 交給 publish
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: build/release-assets/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0 # 附件都已經是壓縮檔

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # 建立、上傳與公開 release；失敗時刪掉這次建的草稿
    concurrency:
      # 同一個 tag 同時只發布一次（例如重新執行時）；不取消正在發布的那一次
      group: release-${{ github.ref }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets

      - name: 檢查附件齊全
        id: check
        # 只用 runner 內建的 Python 與標準函式庫
        run: python3 -m tools.release_assets check "$TAG" "$RUNNER_TEMP/release-assets"

      - name: 確認 tag 仍指向建置的 commit
        id: tag-commit
        run: |
          set -euo pipefail
          commit=$(gh api "repos/$GH_REPO/commits/tags/$TAG" --jq .sha)
          if [ "$commit" != "$GITHUB_SHA" ]; then
            echo "::error::$TAG 現在指向 $commit，不是這次建置的 $GITHUB_SHA：tag 在建置途中被移動過，不發布"
            exit 1
          fi
          echo "$TAG 指向 $GITHUB_SHA"

      - name: 確認這個 tag 還沒有 release
        id: unique
        # 不覆寫既有的 release；這一步通過之後，這個 tag 的草稿都是這次建的，失敗時才可以放心刪
        run: |
          set -euo pipefail
          existing=$(gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" \
            | jq -r --arg tag "$TAG" 'add // [] | .[] | select(.tag_name == $tag) | "\(.id)（draft: \(.draft)）"')
          if [ -n "$existing" ]; then
            echo "::error::$TAG 已經有 release：$existing。要重發，先在 GitHub 上刪掉那個 release（tag 留著），再重新執行"
            exit 1
          fi
          echo "$TAG 還沒有 release"

      - name: 建立草稿
        id: draft
        # 標題與 notes 標 beta；GitHub 產生的變更清單接在 notes 後面。target_commitish 只在 tag 不存在時
        # 才用到：上一步已確認 tag 指向這個 commit，這裡再保險一次，公開時不會從預設分支另建 tag
        run: |
          set -euo pipefail
          title=$(python3 -m tools.release_assets title "$TAG")
          python3 -m tools.release_assets notes "$TAG" "$GH_REPO" "$RUNNER_TEMP/notes.md"
          id=$(gh api --method POST "repos/$GH_REPO/releases" \
            -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" -f name="$title" \
            -F body=@"$RUNNER_TEMP/notes.md" \
            -F draft=true -F prerelease=true -F generate_release_notes=true \
            --jq .id)
          echo "建立草稿 $id：$title"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: 上傳附件
        id: upload
        # 上一步建的草稿是這個 tag 唯一的 release，gh 照 tag 找得到它
        run: gh release upload "$TAG" "$RUNNER_TEMP"/release-assets/*

      - name: 確認草稿上的附件齊全
        id: verify
        # 附件剛好是該有的那幾個、都上傳完成，大小與 SHA-256（GitHub 算的 digest）和建置的相同
        env:
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/$RELEASE_ID" > "$RUNNER_TEMP/release.json"
          python3 -m tools.release_assets verify-release "$TAG" "$RUNNER_TEMP/release-assets" \
            "$RUNNER_TEMP/release.json" --draft

      - name: 以 prerelease 公開
        id: publish
        env:
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        run: |
          set -euo pipefail
          gh api --method PATCH "repos/$GH_REPO/releases/$RELEASE_ID" -F draft=false \
            > "$RUNNER_TEMP/published.json"
          python3 -m tools.release_assets verify-release "$TAG" "$RUNNER_TEMP/release-assets" \
            "$RUNNER_TEMP/published.json" --published
          jq -r .html_url "$RUNNER_TEMP/published.json"

      - name: 失敗時刪掉這次建的草稿（tag 不動）
        id: cleanup
        if: ${{ (failure() || cancelled()) && steps.unique.outcome == 'success' }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" \
            | jq -r --arg tag "$TAG" 'add // [] | .[] | select(.tag_name == $tag) | "\(.id) \(.draft)"' \
            | while read -r id draft; do
                if [ "$draft" = "true" ]; then
                  gh api --method DELETE "repos/$GH_REPO/releases/$id"
                  echo "刪掉草稿 $id"
                else
                  echo "::error::$TAG 的 release $id 已經公開，沒有刪：到 GitHub 上確認它的附件與內容"
                fi
              done
