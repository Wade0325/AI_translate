# CI：PR、push 到 main、每週排程，以及發版前（release.yml 以 workflow_call 呼叫）執行。
#
# 最底下的 `check` 是 ruleset 唯一要求的檢查：不准改名，其他 job 也不准取這個名字。
# 新增 job 時，要加進 `check` 的 needs；`check` 逐一確認每個 needs 的結果，全部 success
# 才綠燈（只改文件時，六個重的 job 可以是 skipped）。
#
# 要跑哪些檢查定義在 tools/check.py：這裡的 job 只呼叫它，不另寫 ruff、pytest、ESLint、vitest、Playwright 等的指令。
# 不要加 on.paths：被路徑過濾掉的 PR 等不到 `check`，會一直卡在等待中；
# 只改文件時的跳過，由 `changes` job 判斷。

name: CI

on:
  pull_request:
    # 預設的三種之外加上 edited：改了 PR 內文要重新檢查 pr-body。edited 也會把其他 job 重跑一次
    # （上面的 concurrency 會取消還在跑的那一次）；只重跑 pr-body 的話，這一次的 `check` 會在
    # 其他 job 沒跑的情況下轉綠，蓋掉前一次的結果
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1" # 每週一 03:17 UTC：抓上游套件與 runner 映像造成的漂移
  workflow_call:

permissions:
  contents: read

concurrency:
  # 同一個 ref 有新的執行時，取消舊的。release.yml 呼叫時 ref 是 tag，不會和 main 的執行互相取消
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # PR 改動的檔案（含改名前的舊路徑）全在 docs/ 底下或是根目錄的 *.md 時，輸出 docs_only=true，
    # 六個重的 job 跳過。只有 PR 才判斷：push、排程與 release.yml 呼叫時一律跑全套
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # 列出 PR 改動的檔案
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - name: 判斷是否只改文件
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "事件是 $EVENT_NAME，不是 PR：跑全套"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 每個檔案一行：路徑，以及改名前的舊路徑（沒有改名時是空字串）
          files="$RUNNER_TEMP/pr-files.tsv"
          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" \
            --jq '.[] | [.filename, (.previous_filename // "")] | @tsv' > "$files"
          count=$(wc -l < "$files")
          echo "PR 改動 $count 個檔案"
          # 這個 API 最多列 3000 個檔案；達到上限時清單可能不完整，不採信
          if [ "$count" -eq 0 ] || [ "$count" -ge 3000 ]; then
            echo "檔案清單是空的或達到 API 上限：跑全套"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          docs_only=true
          while IFS=$'\t' read -r path old_path; do
            for p in "$path" "$old_path"; do
              [ -n "$p" ] || continue
              case "$p" in
                docs/*) ;;
                */*) docs_only=false; echo "不是文件：$p" ;;
                *.md) ;;
                *) docs_only=false; echo "不是文件：$p" ;;
              esac
            done
          done < "$files"
          echo "docs_only=$docs_only"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  python:
    name: python (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      # 只設 PYTHONIOENCODING，讓輸出中文時不出錯；刻意不設 PYTHONUTF8：Windows 腿要和
      # 使用者的環境一樣用系統碼頁，才抓得到 open() 沒指定 encoding 的 bug
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          # Python 3.11 附的 pip 24.0 用系統碼頁讀 requirements 檔，Windows 上遇到中文註解就
          # 解碼失敗；新版 pip 預設用 UTF-8
          pip-version: "26.2.1"
          cache: pip
          cache-dependency-path: |
            backend/requirements-base.txt
            backend/requirements-dev.txt
      - name: 安裝依賴（base 與 dev，不裝 torch 系列）
        run: python -m pip install -r backend/requirements-base.txt -r backend/requirements-dev.txt
      - name: 安裝 ffmpeg 與 ffprobe（BtbN 的 LGPL build，釘版並驗 SHA-256）
        # 測試用真的 ffmpeg 處理合成音檔（#103）。採用 #80 研究建議的來源：BtbN 的 LGPL
        # build，用月底的日期 tag 釘版（BtbN 只承諾月底版保留兩年）。免安裝版（build_release.ps1）
        # 打包同一個 Windows build（#17、#129）。SHA-256 抄自 release 的 checksums.sha256，並和
        # GitHub 的 asset digest 核對過。升版時兩個平台的檔名與雜湊連同 build_release.ps1 一起換，
        # tests/unit/test_ffmpeg_pin.py 檢查兩邊一致。
        # 放在 PATH 最前面，蓋過 runner 映像可能自帶的 ffmpeg
        shell: bash
        env:
          FFMPEG_TAG: autobuild-2026-09-30-13-08
          FFMPEG_BUILD: ffmpeg-n9.0.2-17-g2a571b6068
          SHA256_LINUX: 2d41cbea0ca1a15029b638330740f78d6f5aeb062355bf425433fc938705350a
          SHA256_WINDOWS: 6b264b9e6019103f601d98c292bd332fd87acf1c5e941ddff4fb71760fe63432
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            asset="$FFMPEG_BUILD-win64-lgpl-9.0.zip"; sha256="$SHA256_WINDOWS"
          else
            asset="$FFMPEG_BUILD-linux64-lgpl-9.0.tar.xz"; sha256="$SHA256_LINUX"
          fi
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o "$asset" \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/$FFMPEG_TAG/$asset"
          # 雜湊不符時 sha256sum -c 結束碼非 0，set -e 讓 job 失敗
          echo "$sha256  $asset" | sha256sum -c -
          if [ "$RUNNER_OS" = "Windows" ]; then
            unzip -q "$asset"
            bin="$RUNNER_TEMP/${asset%.zip}/bin"
            cygpath -w "$bin" >> "$GITHUB_PATH"
          else
            tar -xJf "$asset"
            bin="$RUNNER_TEMP/${asset%.tar.xz}/bin"
            echo "$bin" >> "$GITHUB_PATH"
          fi
          "$bin/ffmpeg" -hide_banner -version | sed -n 1p
          "$bin/ffprobe" -hide_banner -version | sed -n 1p
      - name: ruff、basedpyright 與 pytest
        run: python tools/check.py ruff basedpyright pytest

  frontend:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安裝依賴
        working-directory: frontend
        run: npm ci
      - name: ESLint、tsc 與 vitest
        run: python3 tools/check.py eslint tsc vitest
      - name: 取得 main（棘輪要和它比）
        # checkout 只抓這次的 commit；main 是公開的，不需要憑證
        run: git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
      - name: 棘輪（@ts-nocheck 與 baseline 不得比 main 多）
        run: python3 tools/check.py ratchet
      - name: 建置
        working-directory: frontend
        run: npm run build

  browser:
    # 瀏覽器測試（#51）：Playwright 的 Chromium 跑主要頁面，/api 與 WebSocket 都在測試裡 mock，
    # 不需要後端與網路。Chromium 依 Playwright 的版本快取；系統依賴（apt）快取不了，每次都裝
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安裝依賴
        working-directory: frontend
        run: npm ci
      - name: 取得 Playwright 的版本
        id: playwright
        working-directory: frontend
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: 快取 Chromium
        id: browser-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: 安裝 Chromium 與系統依賴
        if: steps.browser-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: 安裝系統依賴（Chromium 已在快取裡）
        if: steps.browser-cache.outputs.cache-hit == 'true'
        working-directory: frontend
        run: npx playwright install-deps chromium
      - name: Playwright
        # GitHub 的 runner 本來就設了 CI=true：playwright.config.js 照它禁止 test.only
        run: python3 tools/check.py playwright

  docker:
    # Docker 模式只要求在 CI 裡保持可用（ADR 0004）：compose 設定、只裝 base 的後端映像，
    # 以及完整依賴（base 加 ml）能否解析。ml 層不在 CI 安裝，由使用者在本機重建確認
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: compose 設定
        run: |
          # 每個服務都讀 .env；CI 沒有這個檔，從範本產生
          cp .env.example .env
          docker compose config --quiet
      - name: 建置後端映像（只裝 base）
        run: docker compose build --build-arg INSTALL_ML=false backend-service
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: 安裝 uv
        run: python -m pip install uv==0.12.23
      - name: 解析完整依賴（只解析、不安裝）
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/uv-cache
        run: |
          set -euo pipefail
          # 目標平台與映像一致：Linux x86_64、Python 3.11
          uv pip compile backend/requirements.txt \
            --python-version 3.11 --python-platform x86_64-unknown-linux-gnu \
            --no-header --output-file "$RUNNER_TEMP/requirements-resolved.txt"
          grep -E '^(torch|torchaudio|silero-vad|numpy)==' "$RUNNER_TEMP/requirements-resolved.txt"
          # 解析只抓套件的中繼資料，快取應該只有幾十 MB；torch 的 wheel 一個就好幾百 MB
          cache_mb=$(du -sm "$UV_CACHE_DIR" | cut -f1)
          echo "uv 快取：${cache_mb} MB"
          if [ "$cache_mb" -gt 200 ]; then
            echo "::error::uv 快取 ${cache_mb} MB，解析時下載了 wheel"
            exit 1
          fi

  portable:
    # 免安裝版的建置（#256）：和 release.yml 的 windows-zip 一樣先建前端，再用 Windows PowerShell
    # 執行 build_release.ps1 -SkipFrontend；不上傳、不發布。打包的改動（build_release.ps1、
    # tools/launcher.cs）因此每個 PR 都在 Windows 上實際建置過一次，不必等維護者在本機建置。
    # - 建置前先在 backend/ 與 data/ 放進用過的開發環境會有的執行期資料（tools/portable_zip.py plant），
    #   build_release.ps1 排除執行期資料的那一步才真的被考到
    # - 啟動器在 build_release.ps1 第 5 步編譯，編譯失敗時那一步就失敗
    # - 建好後檢查 zip：第 7 步清單裡的檔案都在、沒有執行期資料（tools/portable_zip.py check）
    # 每個 PR 都跑（只改文件時跳過）：Python embeddable、uv 與 ffmpeg 每次重新下載，不用快取
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8 # tools/portable_zip.py 印中文
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: 安裝前端依賴
        working-directory: frontend
        run: npm ci
      - name: 建置前端
        working-directory: frontend
        run: npm run build
      - name: 放進執行期資料（模擬用過的開發環境）
        run: python tools/portable_zip.py plant
      - name: 建置免安裝版
        shell: powershell # 和 release.yml 一樣用 Windows PowerShell 5.1，不是 pwsh
        run: .\build_release.ps1 -Version ci -SkipFrontend
      - name: 檢查 zip
        run: python tools/portable_zip.py check build/AI_Translate-ci-win64.zip

  workflows:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: 安裝 zizmor
        run: python -m pip install zizmor==1.30.1
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }} # 線上稽核（impostor-commit 等）要查 action 的 repo
        run: zizmor .

  pr-body:
    # PR 內文要有「使用者看得到的變更」（#38）：用 --body-file 開的 PR 不會套用範本，靠這一步擋。
    # 從 API 讀 PR 現在的內文，重新執行時讀得到補上之後的版本。不是 PR 時不檢查、直接通過
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # 讀 PR 的內文
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 檢查 PR 內文
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 tools/pr_checks.py body

  check:
    if: always()
    needs: [changes, python, frontend, browser, docker, portable, workflows, pr-body]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 逐一確認每個 job 的結果
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          docs_only=$(jq -r '.changes.outputs.docs_only // "false"' <<< "$NEEDS")
          echo "docs_only=$docs_only"
          failed=0
          for job in $(jq -r 'keys[]' <<< "$NEEDS"); do
            result=$(jq -r --arg job "$job" '.[$job].result' <<< "$NEEDS")
            # 只接受 success；只改文件時，changes 以外的 job 也可以是 skipped
            if [ "$result" = "success" ]; then
              echo "通過：$job"
            elif [ "$result" = "skipped" ] && [ "$job" != "changes" ] && [ "$docs_only" = "true" ]; then
              echo "通過：$job（只改文件，跳過）"
            else
              echo "::error::$job 的結果是 $result"
              failed=1
            fi
          done
          exit "$failed"
