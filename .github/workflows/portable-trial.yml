# 試發布（#35）：在乾淨的 Windows runner 上從新的 checkout 建置免安裝版，照使用者的做法跑首次啟動，
# 記下 zip 大小、首次佈建的下載量與耗時、uv 能否解析、沒有 NVIDIA 驅動時能否 import torch、
# health 幾秒就緒、缺不缺 VC++ 執行階段，以及斷網後能否續傳（tools/portable_trial/run_trial.py）。
#
# 只在這個試發布的分支上跑，不進 main、不是 `check` 的一部分；不推 tag、不發布 Release。
# 建好的 zip 以 Actions 的 artifact 保留，給維護者下載後在自己的 Windows 雙擊（SmartScreen、
# Smart App Control 只能在真的 Windows 桌面版上看）。zip 用 archive: false 原樣上傳，下載下來就是
# 發布時的那個 zip，不會再包一層。

name: 試發布（#35）

on:
  push:
    branches: [claude/project-thread-7z1l48]
    paths:
      - .github/workflows/portable-trial.yml
      - tools/portable_trial/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-trial-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trial:
    runs-on: windows-2025
    timeout-minutes: 300
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 建置前確認來源裡沒有 backend/audio_store 與執行期資料
        shell: powershell
        run: |
          $found = @("backend\audio_store", "backend\temp_uploads", "backend\vad_artifacts", "backend\.env", "data") | Where-Object { Test-Path $_ }
          if ($found) { Write-Host "來源裡有：$($found -join ', ')"; exit 1 }
          Write-Host "來源是新的 checkout（$(git rev-parse HEAD)），沒有 backend\audio_store、執行期資料夾、.env 與 data\"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: 安裝前端依賴
        working-directory: frontend
        run: npm ci
      - name: 建置前端
        working-directory: frontend
        run: npm run build
      - name: 建置免安裝版
        shell: powershell # 和 release.yml 一樣用 Windows PowerShell 5.1
        run: .\build_release.ps1 -Version trial1 -SkipFrontend
      - name: 檢查 zip（沒有 audio_store 與其他執行期資料）
        run: python tools/portable_zip.py check build/AI_Translate-trial1-win64.zip
      - name: 安裝量測用的套件
        run: python -m pip install pefile==2024.8.26
      - name: 照使用者的做法跑首次啟動並量測
        run: python tools/portable_trial/run_trial.py --zip build/AI_Translate-trial1-win64.zip --out trial-results --commit ${{ github.sha }}
      - name: 保留量測結果
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trial-results
          path: trial-results
          retention-days: 90
      - name: 保留 zip（給維護者下載後雙擊）
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: build/AI_Translate-trial1-win64.zip
          archive: false # 只能一個檔案；artifact 的名稱就是檔名
          retention-days: 90
